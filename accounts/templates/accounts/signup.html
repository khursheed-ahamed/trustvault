{% extends "base.html" %}
{% block title %}Sign Up — TrustVault{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:4rem auto;">
  <h2 style="margin-bottom:1rem;">Create an Account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn" style="width:100%;margin-top:.5rem;">Sign Up</button>
  </form>
  <p style="margin-top:1rem;text-align:center;">Already have an account? <a href="{% url 'accounts:login' %}">Sign in</a></p>
</div>
{% endblock %}
